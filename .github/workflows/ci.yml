name: CI

# Runs on every push and pull request. It exists mainly so that `yarn build` (the only step that produces
# dist/, which `npm publish` and the Windows exe both need) is exercised long before a release: type-check,
# lint and the unit tests can all pass while the build is broken.

#
# It is also called by release.yml (`workflow_call`) so that a release can only go out when the very same checks
# pass on the tagged commit. `push` is limited to branches: a tag push is handled by release.yml, which calls
# this workflow itself, so the checks do not run twice for a tag.

on:
    push:
        branches: ["**"]
    pull_request:
    workflow_call:
        inputs:
            ref:
                description: "Git ref (tag) to check out; empty = the ref that triggered the run"
                type: string
                required: false
                default: ""

# `github.workflow` is the *caller's* name when this runs through workflow_call, so a release run and a branch
# push on the same ref can never cancel each other.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: ${{ matrix.os }} / node ${{ matrix.node }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest]
                node: [22, 24]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref }}

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: yarn

            # `--frozen-lockfile` is the Yarn 1 flag that makes a stale yarn.lock fail the install.
            - name: Install dependencies
              run: yarn install --frozen-lockfile

            # Covers `src/` and, through scripts/tui-test/tsconfig.json, `tests/` and the TUI harness.
            - name: Type-check
              run: yarn type-check

            - name: Lint
              run: yarn lint

            - name: Format
              run: yarn format:check

            # A stray non-UTF-8 byte passes tsc/eslint/tsx but can break the production bundle (REL-07).
            - name: UTF-8 check
              run: yarn check:utf8

            - name: Build
              run: yarn build

            # The unit tests run on both systems (the one failing test on Linux, see AUDIT-performance.md TOOL-01,
            # now compares paths the way the platform does).
            - name: Unit tests
              run: npx vitest run tests/unit --coverage
              env:
                  GOBLIN_NO_AUDIO: "1"
