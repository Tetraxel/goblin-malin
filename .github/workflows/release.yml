name: Release

# Pipeline (nothing becomes public until everything before it has passed):
#
#   verify ──┐
#   check  ──┼─> build-exe ──> publish-npm ──> github-release
#            ┘
#
#   verify          the tag must be `v` + the version in package.json
#   check           the full CI workflow (type-check, lint, build, unit tests) on the tagged commit
#   build-exe       builds the Windows exe and keeps it as a workflow artifact (not public yet)
#   publish-npm     `npm publish` -- the one step that cannot be undone, so it runs after everything that can fail
#   github-release  attaches the already-built exe to the GitHub release
#
# Trigger it by pushing a `v*` tag. To rehearse, run it by hand (Actions -> Release -> Run workflow) with
# `dry_run` ticked: it does everything except publish to npm and create the GitHub release (`npm pack --dry-run`
# instead).

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing tag to release (e.g. v0.2.0)"
                required: true
                type: string
            dry_run:
                description: "Dry run: build and check everything, but do not publish to npm or create the GitHub release"
                required: true
                type: boolean
                default: true

permissions:
    contents: read

env:
    # The tag being released: the pushed tag, or the one typed into the manual run.
    TAG: ${{ inputs.tag || github.ref_name }}
    DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

jobs:
    verify:
        name: Tag matches package.json
        runs-on: ubuntu-latest
        steps:
            # For a manual run this checks out the tag (and fails if it does not exist), not the branch the run
            # was started from.
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - name: Tag must be v<package.json version>
              shell: bash
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "v$version" ]; then
                    echo "::error::Tag '$TAG' does not match package.json version '$version' (expected 'v$version')."
                    exit 1
                  fi
                  echo "Releasing $TAG (package.json $version)"

    check:
        name: CI
        uses: ./.github/workflows/ci.yml
        with:
            ref: ${{ inputs.tag || github.ref }}

    build-exe:
        name: Build Windows exe
        needs: [verify, check]
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: yarn

            # `--frozen-lockfile` is the Yarn 1 flag that fails on a stale yarn.lock (`--immutable` is Yarn 2+ and
            # is silently ignored by Yarn 1, which then rewrites the lockfile).
            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

            - name: Package executable
              run: yarn package:win

            - uses: actions/upload-artifact@v4
              with:
                  name: goblin-malin-win-x64
                  path: releases/windows/goblin-malin-win-x64.exe
                  if-no-files-found: error

    publish-npm:
        name: Publish to npm
        needs: [build-exe]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # npm trusted publishing (OIDC) + provenance
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"
                  cache: yarn

            # OIDC trusted publishing needs npm >= 11.5.1; pinned to the 11.x line instead of `latest` so a new
            # major cannot change a release.
            - name: Update npm
              run: npm install -g npm@11

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

            - name: Dry run (npm pack)
              if: env.DRY_RUN == 'true'
              run: npm pack --dry-run

            - name: Publish to npm
              if: env.DRY_RUN != 'true'
              run: npm publish --provenance --access public

    github-release:
        name: GitHub release
        needs: [publish-npm]
        if: inputs.dry_run != true
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: goblin-malin-win-x64
                  path: release-assets

            - uses: softprops/action-gh-release@v2
              with:
                  files: release-assets/goblin-malin-win-x64.exe
                  tag_name: ${{ env.TAG }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
