name: Release

# Pipeline (nothing becomes public until everything before it has passed):
#
#   verify ──┐
#   check  ──┴─> publish-npm ──> github-release
#
#   verify          the tag must be `v` + the version in package.json
#   check           the full CI workflow (type-check, lint, build, unit tests) on the tagged commit
#   publish-npm     `npm publish` -- the one step that cannot be undone, so it runs after everything that can fail
#   github-release  creates the GitHub release for the tag; its text comes from scripts/release-notes.mjs
#                   (install instructions + the CHANGELOG.md section + every commit since the previous tag)
#
# Trigger it by pushing a `v*` tag. To rehearse, run it by hand (Actions -> Release -> Run workflow) with
# `dry_run` ticked: it does everything except publish to npm and create the GitHub release (`npm pack --dry-run`
# instead).

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing tag to release (e.g. v0.2.0)"
                required: true
                type: string
            dry_run:
                description: "Dry run: build and check everything, but do not publish to npm or create the GitHub release"
                required: true
                type: boolean
                default: true

permissions:
    contents: read

env:
    # The tag being released: the pushed tag, or the one typed into the manual run.
    TAG: ${{ inputs.tag || github.ref_name }}
    DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

jobs:
    verify:
        name: Tag matches package.json
        runs-on: ubuntu-latest
        steps:
            # For a manual run this checks out the tag (and fails if it does not exist), not the branch the run
            # was started from.
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ inputs.tag || github.ref }}
                  fetch-depth: 0 # the release notes list the commits since the previous tag

            - name: Tag must be v<package.json version>
              shell: bash
              run: |
                  version="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "v$version" ]; then
                    echo "::error::Tag '$TAG' does not match package.json version '$version' (expected 'v$version')."
                    exit 1
                  fi
                  echo "Releasing $TAG (package.json $version)"

            # Fails when CHANGELOG.md has no section for this version, before anything is published. The text is
            # also shown in the run summary: that is the preview of the release page (and what a dry run is for).
            - name: Release notes (preview)
              shell: bash
              run: |
                  node scripts/release-notes.mjs "$TAG" | tee release-notes.md
                  { echo "### Release notes for $TAG"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"

    check:
        name: CI
        uses: ./.github/workflows/ci.yml
        with:
            ref: ${{ inputs.tag || github.ref }}

    publish-npm:
        name: Publish to npm
        needs: [verify, check]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # npm trusted publishing (OIDC) + provenance
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ inputs.tag || github.ref }}

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"
                  cache: yarn

            # OIDC trusted publishing needs npm >= 11.5.1; pinned to the 11.x line instead of `latest` so a new
            # major cannot change a release.
            - name: Update npm
              run: npm install -g npm@11

            # `--frozen-lockfile` is the Yarn 1 flag that fails on a stale yarn.lock (`--immutable` is Yarn 2+ and
            # is silently ignored by Yarn 1, which then rewrites the lockfile).
            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

            - name: Dry run (npm pack)
              if: env.DRY_RUN == 'true'
              run: npm pack --dry-run

            - name: Publish to npm
              if: env.DRY_RUN != 'true'
              run: npm publish --provenance --access public

    github-release:
        name: GitHub release
        needs: [publish-npm]
        if: inputs.dry_run != true
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ inputs.tag || github.ref }}
                  fetch-depth: 0

            - name: Build the release notes
              run: node scripts/release-notes.mjs "$TAG" > release-notes.md

            - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                  tag_name: ${{ env.TAG }}
                  body_path: release-notes.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
